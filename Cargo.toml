[package]
name = "burrow"
version = "0.1.0"
edition = "2021"
description = "A disposable git worktree sandbox for coding agents."
license = "MIT"
repository = "https://github.com/defi0x1/burrow"
readme = "README.md"

[[bin]]
name = "burrow"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
globset = "0.4"
libc = "0.2"

[profile.release]
opt-level = 2
